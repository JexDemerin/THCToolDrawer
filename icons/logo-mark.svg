<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 136" width="332" height="136"
     role="img" aria-label="Together Homecare">
  <!--
    TRACED APPROXIMATION — not the official artwork.

    Redrawn by eye from a screenshot of the Together Homecare logo, because the
    original file was not available. It is the mark only: roof, chimney, window,
    ECG line, heart. The "Together Homecare" wordmark is deliberately absent —
    its serif could not be identified from an image, and a wrong typeface would
    be worse than none.

    Replace this file with the official SVG when it is to hand; everything that
    uses the mark points here, so no other file needs touching.

    Single colour so it can be recoloured by whatever sits around it.
  -->
  <g fill="none" stroke="#AC6B75" stroke-width="12.6"
     stroke-linecap="butt" stroke-linejoin="miter">

    <!-- chimney, drawn first so the roof band crosses it -->
    <path d="M42 20v34" stroke-width="19.4"/>

    <!-- roof -->
    <path d="M6 79 90 8l78 71"/>

    <!-- ECG line running out of the roof, into the heart -->
    <path d="M174 77h12l4-11 4 11h5l16-74 17 125 12-51h19"/>

    <!-- heart -->
    <path d="M259 77c-7-14-2-33 13-33 9 0 14 7 15 13 1-6 6-13 15-13
             15 0 20 19 13 33-6 12-19 22-28 30-9-8-22-18-28-30z"/>
  </g>

  <!-- window, 2×2 -->
  <g fill="#AC6B75">
    <rect x="75" y="51" width="13" height="13"/>
    <rect x="91" y="51" width="13" height="13"/>
    <rect x="75" y="67" width="13" height="13"/>
    <rect x="91" y="67" width="13" height="13"/>
  </g>
</svg>
